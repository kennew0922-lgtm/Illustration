<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>THE MAGE'S HIDEOUT</title>
    <style>
        /* 🟣 全体＆SAO風紫系テーマの基本設定 */
        /*body {
            margin: 0;
            padding: 0;
            background-color: #0d0614; 
            color: #e0d0ff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }*/

        body {
            margin: 0;
            padding: 0;
  background-image: url("https://socrarius-tool.com/Illustration/star.jpg"); /* 画像のファイルパスかURLを指定 */
  background-size: cover;                        /* 画面の縦横比に合わせて隙間なく引き伸ばす */
  background-position: center center;            /* 画像の中心が画面の真ん中にくるように配置 */
  background-repeat: no-repeat;                  /* 画像がタイル状に繰り返されるのを防ぐ */
  background-attachment: fixed;                  /* 画面をスクロールしても背景画像を固定する（お好みで） */
   font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
}


        /* 🟣 1. 一番上のタイトルBOX */
        .mage-header-box {
            background: rgba(30, 10, 50, 0.7);
            border: 2px solid #4A2E65;
            border-radius: 8px;
            padding: 10px 140px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(177, 156, 217, 0.4);
        }
        .mage-header-box h1 {
            margin: 0;
            font-size: 1rem;
            color: #d8bfd8;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 6px rgba(216, 191, 216, 0.8);
        }

        /* 🟣 2. 女の子（ループ動画）を入れるBOX */
        .mage-video-box {
            background: rgba(20, 5, 35, 0.8);
            border: 2px solid #9370db;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(147, 112, 219, 0.5);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mage-video-box video {
            width: 800px; /* お好みに合わせて調整してね */
            max-width: 90vw;
            border-radius: 6px;
            display: block;
        }

        /* 🟣 3. 一番下のADV風メッセージBOX（中央揃え・クリックで進行） */
        .adv-textbox {
            width: 620px;
            max-width: 90vw;
            height: 110px;
            background: rgba(15, 5, 25, 0.85);
            border: 2px solid #ba55d3;
            border-radius: 8px;
            padding: 15px 20px;
            box-sizing: border-box;
            box-shadow: inset 0 0 15px rgba(186, 85, 211, 0.3), 0 0 15px rgba(186, 85, 211, 0.4);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 中央揃え */
            text-align: center;   /* テキストも中央揃え */
            white-space: pre-wrap;/*改行*/
        }
        
        .adv-speaker {
            font-size: 0.85rem;
            color: #dda0dd;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .adv-text {
            font-size: 1rem;
            color: #f3e5f5;
            margin: 0;
            line-height: 1.4;
            text-shadow: 0 0 5px rgba(243, 229, 245, 0.5);
            white-space: pre-wrap;/*改行*/
        }

        .adv-next-hint {
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 0.75rem;
            color: #ba55d3;
            animation: blink 1.2s infinite;
        }



        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 1. 最上部のタイトル -->
    <div class="mage-header-box">
        <h1>INSIDE THE SPACESHIP</h1>
    </div>

    <!-- 2. 女の子のループ動画BOX // ✨少年に改造  -->
    <div class="mage-video-box">
        <!-- ここに作成したループ動画のファイル名を入れてね（例: loop.mp4）//✨少年に改造 -->
        <img src="https://socrarius-tool.com/Illustration/boy.webp" >
    </div>

    <!-- 3. ADV風メッセージBOX -->
    <div class="adv-textbox" id="advBox" onclick="progressText()">
        <!--<div class="adv-speaker" id="speakerName">アミ</div>-->
        <p class="adv-text" id="advText">ん……？<br>誰、君？<br>シップの人じゃないよね？</p>
        <div class="adv-next-hint">▼</div>
    </div>

    <!-- ✨解説画像配置 -->
<div id="advImageContainer" style="position: absolute; top: 147px; right: 50px; z-index: 100; display: none;">
  <img id="advImage" src="" alt="解説" style="width: 450px; max-width: 45vw; height: auto; border-radius: 8px; border: 1px solid rgba(0, 242, 254, 0.6); box-shadow: 0 0 20px rgba(0, 242, 254, 0.6); display: block;">
</div>

<script>
        // ✨ ADVパートスタート～♪
        const story = [
            { text: "ん……？\n誰、君？\nシップの人じゃないよね？" },
            { text: "コアファイターが着艦したって話も聞いてないし……" },
            { text: "まさかゲートを通って来たの？" },
            { text: "よくあんな隙間を見つけたね。" },
            { text: "偶然？\nそれとも直感？" },
            { text: "違和感を察知したのならニュータイプになれるよ。" },
            { text: "ここまで来た君に……" },
            { text: "僕が教えられることは少ないんだけど……" },
            { text: "え？\nループ動画が上手く作れなくて困ってるの？" },
            { text: "それなら僕の得意分野だから簡単に作れる方法を教えるよ。" },
            { text: "一つはすごくシンプル。\n動画を複製して逆再生。" },
            { text: "でも、この方法だと違和感が出るケースが多いよね。" },
            { text: "本当に綺麗に仕上げたいなら自力で差分を全部描くなんだけど……" },
            { text: "はは。\nそれは時間がかかり過ぎるし、絵心と編集技術が無いと無理だよね。" },
            { text: "少しブレが出るんだけど……\n逆再生や手描き不要で動画をループさせる方法はね……" },
            // 🌸★ ここで解説画像を登場させる！ ★🌸
        { 
            text: "動画の最初と最後に逆フェードをかけるんだよ。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "やり方は本当に簡単♪",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "動画の最初の1枚目をコピーして始まりと終わりに2秒のフェードをかければOK。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "ただ、これで動画を書きだした時に始まりと終わりの2秒ぐらいが止まってるんだ。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "だから書きだした動画を再度編集して、始まりと終わりをカット！",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "ループさせて違和感がなければ書き出し♪",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "違和感があれば切り取り場所を微調整だよ。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "これで大体は上手くいく。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "動画をコピーして静止画を一枚作成。\nフェードをかけて書き出し\n書き出した動画の始まりと終わりの2秒を削除して再度書き出し。",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "これだけだから、慣れれば10分以内に終わるよ♪",
            image: "https://socrarius-tool.com/Illustration/explanation.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "一応、普通に動画の最初と最後にフェードをかけて繋ぐ方法もあるよ。",
            image: "https://socrarius-tool.com/Illustration/explanation2.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "やり方は本当に簡単で動画を2回コピーしてそれぞれのつなぎ目に1秒ぐらいのフェードをかけて書き出し。",
            image: "https://socrarius-tool.com/Illustration/explanation2.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "書きだした動画を再編集してフェード部分をスタートとエンド地点にして他を切り取れば完成♪",
            image: "https://socrarius-tool.com/Illustration/explanation2.png" // ←ここに解説画像のURLを指定！
        },
        { 
            text: "この方法ならスマホの編集ソフトで寝ながらでもできるよ。",
            image: "https://socrarius-tool.com/Illustration/explanation2.png" // ←ここに解説画像のURLを指定！
        },
            { text: "でも、僕のお勧めは最初に教えた方。" },
            { text: "違和感はほとんどなくなるし、PCで編集なら半透過動画とかも作れるしね。" },
            { text: "僕が教えれるのはこのぐらいかな？" },
            { text: "やり方は一つじゃないし、全ては発想次第だよ。" },
            { text: "じゃあ、そろそろシップの正規乗組員じゃない君はゲートで元いた場所に帰った方がいいと思う。" },
            { text: "不法侵入だし、艦長に見つかると怖いから……" },
            { text: "じゃあね。\nシップの人以外の人と話せて楽しかったよ。" }
        ];

        let currentIndex = 0;
    const textElem = document.getElementById("advText");
    const imgContainer = document.getElementById("advImageContainer");
    const imgElem = document.getElementById("advImage");

    function progressText() {
        currentIndex++;
        if (currentIndex < story.length) {
            const currentStory = story[currentIndex];
            
            // 1. テキスト更新
            textElem.textContent = currentStory.text;

            // 2. 画像の表示・非表示判定（If文魔法！）
            if (currentStory.image) {
                imgElem.src = currentStory.image;
                imgContainer.style.display = "block"; // 画像があれば表示！
            } else {
                imgContainer.style.display = "none";  // 画像が無ければ自動で消す！
            }

        } else {
            // ✨ セリフがすべて終わったら元の場所へ帰還！
            window.location.href = "https://socrarius-tool.com/photo_48-k_yui_nanami/";
        }
    }
</script>

</body>
</html>
